<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP: allow self-origin scripts, workers, and doubao API -->
  <!-- 'unsafe-eval' needed for webpack dev mode; remove in production -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' 'unsafe-eval';
             script-src 'self' 'unsafe-inline' 'unsafe-eval';
             connect-src *;
             img-src 'self' data: blob:;
             worker-src 'self' blob:;
             child-src 'self' blob:;" />
  <title>eBook AI Reader</title>
  <style>
    /* Prevent FOUC (Flash of Unstyled Content) */
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #root { width: 100vw; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
